name: Verilator Regression & Claude Auto-Fix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Verilator Tests
    runs-on: ubuntu-latest
    outputs:
      test_outcome: ${{ steps.run_tests.outcome }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Verilator and Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog make

      - name: Run Verilator Lint
        id: run_tests
        continue-on-error: true
        run: |
          mkdir -p build_logs
          # Run Verilator lint on all SystemVerilog files in the root and subdirectories
          verilator --lint-only -Wall $(find . -name "*.sv" -o -name "*.v") 2>&1 | tee build_logs/verilator_lint.log || exit 1

      - name: Upload Logs on Failure
        if: steps.run_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: regression-failure-logs
          path: build_logs/

  claude-autofix:
    name: Auto-Fix RTL with Claude
    needs: test
    if: needs.test.outputs.test_outcome == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Logs
        uses: actions/download-artifact@v4
        with:
          name: regression-failure-logs
          path: build_logs/

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            The Verilator regression suite failed on the hardware files in this repo.
            1. Read the error log in `build_logs/verilator_lint.log`.
            2. Identify syntax or logic issues in the `.sv` or `.v` files.
            3. Modify the broken files to resolve all compilation/lint issues.
            4. Create a Pull Request with the working fix and explain what caused the bug.
