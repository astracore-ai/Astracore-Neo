# Neo regression on GitHub Actions (drop 0.24, repository layout = handoff package).
# Every job builds the flat layout from the numbered folders with plain copies, then writes its logs to its own
# branch ci-logs-<job> (ci_logs/<job>/*.txt), so results can be read from the repository and jobs never
# overwrite each other's results.
name: regress
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
# One run per branch at a time: a new push (every folder of a web upload is one) cancels the queued and running runs
# of the earlier commits, so only the last commit's run -- the one with every file -- is executed (drop 0.22).
concurrency:
  group: regress-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-regress:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy openpyxl
      - name: flat layout
        run: |
          cp -r 01_rtl rtl && cp -r 02_dv/tb tb && cp -r 02_dv/dv dv && cp -r 02_dv/sim sim
          for v in 02_dv/vectors*; do cp -r "$v" "$(basename "$v")"; done
          cp -r 03_models/model model && cp -r 03_models/compiler compiler && cp -r 04_software sw && cp -r 05_safety safety
          cp 07_ci/Makefile Makefile
          mkdir -p ci_logs/python-regress && echo "run ${{ github.run_number }} $(date -u)" > ci_logs/python-regress/RUN.txt
          ls
      - name: regress (the CI subset; the whole-convolution neosim runs exceed the job limit and are covered by Verilator)
        run: |
          set -o pipefail
          make regress_ci 2>&1 | tee ci_logs/python-regress/regress.txt
      - name: tool qualification kit
        if: always()
        run: python3 compiler/tool_qual.py 2>&1 | tee ci_logs/python-regress/tool_qual.txt
      - name: publish logs
        if: always()
        run: |
          git config user.name "neo-ci" && git config user.email "ci@users.noreply.github.com"
          mkdir -p ci_logs/python-regress && echo "finished $(date -u)" >> ci_logs/python-regress/RUN.txt
          git checkout --orphan ci-logs-python-regress
          git rm -rfq --cached . 2>/dev/null || true
          git add -f ci_logs
          git commit -m "python-regress logs run ${{ github.run_number }}" || true
          git push origin ci-logs-python-regress --force
  hdl-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - name: install simulators
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator && verilator --version && iverilog -V | head -1
      - name: flat layout
        run: |
          cp -r 01_rtl rtl && cp -r 02_dv/tb tb && cp -r 02_dv/dv dv && cp -r 02_dv/sim sim
          for v in 02_dv/vectors*; do cp -r "$v" "$(basename "$v")"; done
          cp -r 03_models/model model && cp -r 03_models/compiler compiler && cp -r 04_software sw && cp -r 05_safety safety
          cp 07_ci/Makefile Makefile
          mkdir -p ci_logs/hdl-sim && echo "run ${{ github.run_number }} $(date -u)" > ci_logs/hdl-sim/RUN.txt
      - name: lint
        run: set -o pipefail; make lint 2>&1 | tee ci_logs/hdl-sim/lint.txt
      - name: iverilog streaming core
        if: always()
        run: set -o pipefail; make iverilog 2>&1 | tee ci_logs/hdl-sim/iverilog.txt
      - name: iverilog neo_core
        if: always()
        run: set -o pipefail; make iverilog_core 2>&1 | tee ci_logs/hdl-sim/iverilog_core.txt
      - name: verilator streaming core, neo_core, tile mesh
        if: always()
        run: set -o pipefail; make verilator 2>&1 | tee ci_logs/hdl-sim/verilator.txt
      - name: publish logs
        if: always()
        run: |
          git config user.name "neo-ci" && git config user.email "ci@users.noreply.github.com"
          mkdir -p ci_logs/hdl-sim && echo "finished $(date -u)" >> ci_logs/hdl-sim/RUN.txt
          git checkout --orphan ci-logs-hdl-sim
          git rm -rfq --cached . 2>/dev/null || true
          git add -f ci_logs
          git commit -m "hdl-sim logs run ${{ github.run_number }}" || true
          git push origin ci-logs-hdl-sim --force
  hdl-mesh8:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # its own group (drop 0.30): a push cancels only this job's own predecessor, and the job is not held by the regress
    # group while python-regress / hdl-sim of the same run are still on it
    concurrency:
      group: mesh8-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - name: install simulator
        run: sudo apt-get update && sudo apt-get install -y verilator && verilator --version
      - name: flat layout
        run: |
          cp -r 01_rtl rtl && cp -r 02_dv/tb tb && cp -r 02_dv/dv dv && cp -r 02_dv/sim sim
          for v in 02_dv/vectors*; do cp -r "$v" "$(basename "$v")"; done
          cp -r 03_models/model model && cp -r 03_models/compiler compiler && cp -r 04_software sw && cp -r 05_safety safety
          cp 07_ci/Makefile Makefile
          mkdir -p ci_logs/hdl-mesh8 && echo "run ${{ github.run_number }} $(date -u)" > ci_logs/hdl-mesh8/RUN.txt
          nproc; free -m; df -h / | tail -1
      # heartbeat (drop 0.30): runs 74 and 85 left nothing on the log branch, not even the timeout publish, so the job
      # publishes RUN.txt as soon as it starts and again after the build -- whatever happens later, the branch shows how
      # far it got
      - name: publish heartbeat
        run: |
          git config user.name "neo-ci" && git config user.email "ci@users.noreply.github.com"
          echo "started $(date -u)" >> ci_logs/hdl-mesh8/RUN.txt
          git checkout --orphan ci-logs-hdl-mesh8 && git rm -rfq --cached . 2>/dev/null || true
          git add -f ci_logs && git commit -q -m "hdl-mesh8 heartbeat run ${{ github.run_number }}" && git push -q origin ci-logs-hdl-mesh8 --force
      # (the job stays on the orphan branch: the working tree keeps every file, and the final publish commits onto it)
      # the runner's own toolchains are removed first (~10 GB of the 14 GB disk): the cancelled run-86 job published its
      # "finished" line, so a cancel or a timeout does publish -- runs 74 and 85 left nothing, i.e. the runner itself died
      # during the build, out of disk or memory being the usual cause
      - name: build the 8x8 silicon mesh (Verilator, 4 build jobs)
        run: |
          set -o pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost 2>/dev/null || true
          df -h / | tail -1
          make cocotb_mesh8_build 2>&1 | tee ci_logs/hdl-mesh8/build.txt
          echo "built $(date -u)" >> ci_logs/hdl-mesh8/RUN.txt; free -m; df -h / | tail -1; du -sh dv/cocotb/sim_build_mesh8 2>/dev/null || true
      - name: publish heartbeat after the build
        run: |
          git add -f ci_logs && git commit -q -m "hdl-mesh8 built run ${{ github.run_number }}" && git push -q origin ci-logs-hdl-mesh8 --force
      - name: cocotb on the 8x8 silicon mesh
        run: set -o pipefail; make cocotb_mesh8_run 2>&1 | tee ci_logs/hdl-mesh8/mesh8.txt
      - name: publish logs
        if: always()
        run: |
          git config user.name "neo-ci" && git config user.email "ci@users.noreply.github.com"
          mkdir -p ci_logs/hdl-mesh8 && echo "finished $(date -u)" >> ci_logs/hdl-mesh8/RUN.txt
          git checkout --orphan ci-logs-hdl-mesh8 2>/dev/null || git checkout ci-logs-hdl-mesh8
          git rm -rfq --cached . 2>/dev/null || true
          git add -f ci_logs
          git commit -m "hdl-mesh8 logs run ${{ github.run_number }}" || true
          git push origin ci-logs-hdl-mesh8 --force
  tiles:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - name: flat layout
        run: |
          cp -r 01_rtl rtl && cp -r 02_dv/tb tb && cp -r 02_dv/dv dv && cp -r 02_dv/sim sim
          for v in 02_dv/vectors*; do cp -r "$v" "$(basename "$v")"; done
          cp -r 03_models/model model && cp -r 03_models/compiler compiler && cp -r 04_software sw && cp -r 05_safety safety
          cp 07_ci/Makefile Makefile
          mkdir -p ci_logs/tiles && echo "run ${{ github.run_number }} $(date -u)" > ci_logs/tiles/RUN.txt
      - run: |
          make regress 2>&1 | tee ci_logs/tiles/regress_full.txt || true
          for t in M3 M9 M12 M13 M11 M8 M1 M2 M4 M5 M6 M7; do python3 sim/run_tile_test.py $t 2>&1 | tee ci_logs/tiles/$t.txt; done
          python3 sim/run_two_layer.py 2>&1 | tee ci_logs/tiles/M10.txt
      - name: publish logs
        if: always()
        run: |
          git config user.name "neo-ci" && git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs-tiles
          git rm -rfq --cached . 2>/dev/null || true
          git add -f ci_logs
          git commit -m "tiles logs run ${{ github.run_number }}" || true
          git push origin ci-logs-tiles --force
