# Neo regression on GitHub Actions (drop 0.24, repository layout = handoff package; drop 0.34: the mesh job measured; drop 0.35: the
# 64-tile mesh of 32x32 cores built hierarchically -- the tile verilated once -- and the lint step a full -Wall gate; drop 0.40:
# the synth job -- every unit of the silicon tile through Yosys (slang front end) + OpenSTA on the ASAP7 proxy library;
# drop 0.42: the pnr job -- synth.py's netlists of chosen blocks through OpenROAD-flow-scripts, weekly and on demand).
# Every job builds the flat layout from the numbered folders with plain copies, then writes its logs to its own
# branch ci-logs-<job> (ci_logs/<job>/*.txt), so results can be read from the repository and jobs never
# overwrite each other's results.
name: regress
on:
  push:
    branches: [main]
    paths-ignore: ['00_overview/**', '**.md']     # a documents-only push (drop log, spec, reports) runs nothing (drop 0.41)
  pull_request:
  workflow_dispatch:
    inputs:                                       # the pnr job's (drop 0.42); a plain dispatch runs every job as before
      pnr_only:
        description: "run only the place-and-route job (pnr-plan + pnr), none of the others"
        type: boolean
        default: false
      pnr_blocks:
        description: "pnr: blocks to place and route (07_ci/pnr/designs/<block>), comma-separated"
        type: string
        default: "mac_pe,c16_systolic_array,c16_neo_core"
      pnr_period:
        description: "pnr: clock period in ps for synth.py and the flow"
        type: string
        default: "1000"
      pnr_flow_args:
        description: "pnr: extra ORFS make variables, e.g. TNS_END_PERCENT=5 NEO_MACRO_PLACEMENT=1"
        type: string
        default: ""
      pnr_image:
        description: "pnr: the ORFS docker image (empty: the tag 07_ci/pnr/tools.sh pins)"
        type: string
        default: ""
  schedule:
    - cron: "0 2 * * 0"                           # Sunday 02:00 UTC: the pnr job alone (drop 0.42)
permissions:
  contents: write
# One run per branch at a time: a new push (every folder of a web upload is one) cancels the queued and running runs
# of the earlier commits, so only the last commit's run -- the one with every file -- is executed (drop 0.22). The weekly
# pnr run and a pnr-only dispatch have a group of their own (drop 0.42): they neither cancel nor are cancelled by a push,
# and a pnr-only dispatch's group carries its block list -- one for other blocks does not cancel a 6 h run in flight.
concurrency:
  group: regress-${{ github.ref }}${{ (github.event_name == 'schedule' || inputs.pnr_only) && format('-pnr-{0}', inputs.pnr_blocks) || '' }}
  cancel-in-progress: true
jobs:
  python-regress:
    if: github.event_name != 'schedule' && !inputs.pnr_only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy openpyxl
      - name: flat layout
        run: |
          cp -r 01_rtl rtl && cp -r 02_dv/tb tb && cp -r 02_dv/dv dv && cp -r 02_dv/sim sim
          for v in 02_dv/vectors*; do cp -r "$v" "$(basename "$v")"; done
          cp -r 03_models/model model && cp -r 03_models/compiler compiler && cp -r 04_software sw && cp -r 05_safety safety
          cp 07_ci/Makefile Makefile
          mkdir -p ci_logs/python-regress && echo "run ${{ github.run_number }} $(date -u)" > ci_logs/python-regress/RUN.txt
          ls
      - name: regress (the CI subset; the whole-convolution neosim runs exceed the job limit and are covered by Verilator)
        run: |
          set -o pipefail
          make regress_ci 2>&1 | tee ci_logs/python-regress/regress.txt
      - name: tool qualification kit
        if: always()
        run: python3 compiler/tool_qual.py 2>&1 | tee ci_logs/python-regress/tool_qual.txt
      - name: publish logs
        if: always()
        run: |
          git config user.name "neo-ci" && git config user.email "ci@users.noreply.github.com"
          mkdir -p ci_logs/python-regress && echo "finished $(date -u)" >> ci_logs/python-regress/RUN.txt
          git checkout --orphan ci-logs-python-regress
          git rm -rfq --cached . 2>/dev/null || true
          git add -f ci_logs
          git commit -m "python-regress logs run ${{ github.run_number }}" || true
          git push origin ci-logs-python-regress --force
  hdl-sim:
    if: github.event_name != 'schedule' && !inputs.pnr_only
    runs-on: ubuntu-latest
    timeout-minutes: 150                           # drop 0.42: 120 -> 150 for the chip top's suite after the ~95 minutes before it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - name: install simulators
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator time && verilator --version && iverilog -V | head -1   # GNU time: per-build statistics (drop 0.34)
      - name: flat layout
        run: |
          cp -r 01_rtl rtl && cp -r 02_dv/tb tb && cp -r 02_dv/dv dv && cp -r 02_dv/sim sim
          for v in 02_dv/vectors*; do cp -r "$v" "$(basename "$v")"; done
          cp -r 03_models/model model && cp -r 03_models/compiler compiler && cp -r 04_software sw && cp -r 05_safety safety
          cp 07_ci/Makefile Makefile
          mkdir -p ci_logs/hdl-sim && echo "run ${{ github.run_number }} $(date -u)" > ci_logs/hdl-sim/RUN.txt
      - name: lint
        run: set -o pipefail; make lint 2>&1 | tee ci_logs/hdl-sim/lint.txt
      # the two Icarus steps gate since drop 0.43: Ubuntu's Icarus 12 runs both testbenches clean (the RTL's receivers of
      # unpacked output ports are nets, ecc39's masks constants) and the targets fail unless the testbench prints ALL PASS
      # (vvp exits 0 whatever it prints, which is how the standing X failures passed these steps before)
      - name: iverilog streaming core (Icarus 12, gating)
        if: always()
        run: set -o pipefail; make iverilog 2>&1 | tee ci_logs/hdl-sim/iverilog.txt
      - name: iverilog neo_core (Icarus 12, gating)
        if: always()
        run: set -o pipefail; make iverilog_core 2>&1 | tee ci_logs/hdl-sim/iverilog_core.txt
      - name: verilator streaming core, neo_core, tile mesh
        if: always()
        run: set -o pipefail; make verilator 2>&1 | tee ci_logs/hdl-sim/verilator.txt
      # the chip top (drop 0.42): neo_top -- 2x2 tiles of 16x8 cores, two bridge nodes, the AXI4-Lite control plane -- under
      # cocotb, T1-T5 with clk / aclk at 1.0 / 1.6 ns, then the same build with aclk == clk (dv/cocotb/test_neo_top.py)
      - name: cocotb chip top (bridges, control plane, two clock domains)
        if: always()
        run: set -o pipefail; make cocotb_top 2>&1 | tee ci_logs/hdl-sim/top.txt
      - name: publish logs
        if: always()
        run: |
          git config user.name "neo-ci" && git config user.email "ci@users.noreply.github.com"
          mkdir -p ci_logs/hdl-sim && echo "finished $(date -u)" >> ci_logs/hdl-sim/RUN.txt
          git checkout --orphan ci-logs-hdl-sim
          git rm -rfq --cached . 2>/dev/null || true
          git add -f ci_logs
          git commit -m "hdl-sim logs run ${{ github.run_number }}" || true
          git push origin ci-logs-hdl-sim --force
  hdl-mesh8:
    if: github.event_name != 'schedule' && !inputs.pnr_only
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # the build knobs, the one place to set them (drop 0.34). Drop 0.35: the mesh builds verilate hierarchically -- neo_tile
    # is a hierarchical block, verilated once and instantiated 64 times -- so the silicon mesh (MESH8_VARIANT=mesh8: 8x8
    # tiles of 32x32 cores, silicon depths, 1024-bit links) is the default again. Run 115 measured the flat builds: the
    # 16x8-core variant's verilation peaked at 14.0 GB of the runner's 16 GB and wrote 791 MB of C++; the 32x32 mesh never
    # verilated flat (runs 74-111, exit 143 within minutes). Hierarchically, measured with the same Verilator 5.020: mesh8
    # 36 s and 0.76 GB, 105 MB of C++; mesh8s 21 s and 0.44 GB. MESH8_BUILD_JOBS now reaches the C++ compile (make -j);
    # run 115's compile ran one file at a time. MESH8_CFLAGS is empty: Verilator's own split (-Os on the model's fast path,
    # -O0 on the slow path) as in every hdl-sim build -- "-CFLAGS -O1" (the drop-0.33 memory fallback) also optimised the
    # block's 6.5 MB VPI symbol table (20,000 registrations in one function, cocotb's --public-flat-rw inside the block),
    # the long pole of the compile at >20 min on one core; at -O0 it is minutes. The measurements stay: GNU time around
    # every build (build_stats.txt), the memory sampler pushed every two minutes (mem.txt). MESH8_PROBE 1 would add the
    # bounded flat attempt at the 32x32 mesh after a mesh8s run (read in run 115; off). mesh8s remains the fallback variant.
    env:
      MESH8_VARIANT: mesh8
      MESH8_BUILD_JOBS: 4
      MESH8_CFLAGS: ""
      MESH8_PROBE: "0"
    # its own group (drop 0.30): a push cancels only this job's own predecessor, and the job is not held by the regress
    # group while python-regress / hdl-sim of the same run are still on it
    concurrency:
      group: mesh8-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - name: install simulator and GNU time
        run: sudo apt-get update && sudo apt-get install -y verilator time && verilator --version && /usr/bin/time --version
      - name: flat layout
        run: |
          cp -r 01_rtl rtl && cp -r 02_dv/tb tb && cp -r 02_dv/dv dv && cp -r 02_dv/sim sim
          for v in 02_dv/vectors*; do cp -r "$v" "$(basename "$v")"; done
          cp -r 03_models/model model && cp -r 03_models/compiler compiler && cp -r 04_software sw && cp -r 05_safety safety
          cp 07_ci/Makefile Makefile
          mkdir -p ci_logs/hdl-mesh8 && echo "run ${{ github.run_number }} $(date -u)" > ci_logs/hdl-mesh8/RUN.txt
          { echo "cores $(nproc)"; free -m | sed -n 2,3p; df -h / | tail -1; } | tee -a ci_logs/hdl-mesh8/RUN.txt
          echo "variant ${MESH8_VARIANT-mesh8}, ${MESH8_BUILD_JOBS-4} build jobs, CFLAGS [${MESH8_CFLAGS-}], hierarchical, probe of the 32x32 mesh ${MESH8_PROBE-0}" | tee -a ci_logs/hdl-mesh8/RUN.txt
      # heartbeat (drop 0.30): the job publishes RUN.txt as soon as it starts; the job then stays on the orphan branch, the
      # working tree keeps every file, and every later publish commits onto it (all of them through one lock, drop 0.34)
      - name: publish heartbeat
        run: |
          git config user.name "neo-ci" && git config user.email "ci@users.noreply.github.com"
          echo "started $(date -u)" >> ci_logs/hdl-mesh8/RUN.txt
          git checkout --orphan ci-logs-hdl-mesh8 && git rm -rfq --cached . 2>/dev/null || true
          git add -f ci_logs && git commit -q -m "hdl-mesh8 heartbeat run ${{ github.run_number }}" && git push -q origin ci-logs-hdl-mesh8 --force
      # the memory sampler (drop 0.34): one line every 20 s into mem.txt -- memory used / available, swap, the size of the
      # build directories, the largest process -- and a publisher that pushes the log directory every two minutes. Both run
      # in the background across the following steps (a step's background processes outlive the step) and are stopped by
      # the final publish. A runner that dies mid-build leaves the trajectory up to its last push on the branch.
      - name: start the memory sampler
        run: |
          cat > ci_sampler.sh <<'EOF'
          #!/bin/bash
          while true; do
            top=$(ps -eo rss=,comm= --sort=-rss | awk 'NR==1 {printf "%s %d MB", $2, $1 / 1024}')
            build=$(du -sm dv/cocotb/sim_build* 2>/dev/null | awk '{s += $1} END {print s + 0}')
            echo "$(date -u +%H:%M:%S) $(free -m | awk 'NR==2 {printf "used %d MB, avail %d MB", $3, $7} NR==3 {printf ", swap %d MB", $3}'), build dirs $build MB, largest $top" >> ci_logs/hdl-mesh8/mem.txt
            sleep 20
          done
          EOF
          cat > ci_publisher.sh <<'EOF'
          #!/bin/bash
          while true; do
            sleep 120
            flock -w 60 .ci_publish.lock -c "git add -f ci_logs && git commit -q -m 'hdl-mesh8 progress run $1' && git push -q -f origin ci-logs-hdl-mesh8" >/dev/null 2>&1 || true
          done
          EOF
          nohup bash ci_sampler.sh >/dev/null 2>&1 &
          echo $! > ci_sampler.pid
          nohup bash ci_publisher.sh ${{ github.run_number }} >/dev/null 2>&1 &
          echo $! > ci_publisher.pid
          sleep 25 && cat ci_logs/hdl-mesh8/mem.txt
      # (the drop-0.34 A/B of the 16x8 suite with and without --public-flat-rw is gone: cocotb's own Makefile.verilator passes
      # the flag on every build, so run 115 timed two identical builds -- 890,656 and 890,648 KB)
      - name: build the 8x8 mesh (MESH8_VARIANT; MESH8_BUILD_JOBS build jobs, MESH8_CFLAGS; hierarchical since drop 0.35)
        run: |
          set -o pipefail
          V=${MESH8_VARIANT-mesh8}
          echo "build of $V starts $(date -u)" | tee -a ci_logs/hdl-mesh8/RUN.txt
          make cocotb_${V}_build STATS=ci_logs/hdl-mesh8/build_stats.txt MESH8_BUILD_JOBS=${MESH8_BUILD_JOBS-4} MESH8_CFLAGS="${MESH8_CFLAGS-}" 2>&1 | tee ci_logs/hdl-mesh8/build.txt
          { echo "built $(date -u)"; free -m | sed -n 2p; df -h / | tail -1; du -sh dv/cocotb/sim_build_$V 2>/dev/null || true; tail -1 ci_logs/hdl-mesh8/build_stats.txt; } | tee -a ci_logs/hdl-mesh8/RUN.txt
      - name: publish heartbeat after the build
        run: |
          flock -w 120 .ci_publish.lock -c 'git add -f ci_logs && git commit -q -m "hdl-mesh8 built run ${{ github.run_number }}" && git push -q origin ci-logs-hdl-mesh8 --force'
      - name: cocotb on the 8x8 mesh
        run: |
          set -o pipefail
          make cocotb_${MESH8_VARIANT-mesh8}_run STATS=ci_logs/hdl-mesh8/build_stats.txt 2>&1 | tee ci_logs/hdl-mesh8/mesh8.txt
          { echo "run done $(date -u)"; tail -1 ci_logs/hdl-mesh8/build_stats.txt; } | tee -a ci_logs/hdl-mesh8/RUN.txt
      - name: publish the variant's results
        run: |
          flock -w 120 .ci_publish.lock -c 'git add -f ci_logs && git commit -q -m "hdl-mesh8 ${{ env.MESH8_VARIANT }} results run ${{ github.run_number }}" && git push -q origin ci-logs-hdl-mesh8 --force'
      # the probe (drop 0.34): the 32x32 mesh's FLAT verilation under the sampler, bounded to 30 min -- a measurement of where
      # it dies, taken only after a mesh8s variant's results are on the branch (read in run 115; off since drop 0.35)
      - name: probe the 32x32 mesh under the sampler (MESH8_PROBE)
        if: env.MESH8_PROBE == '1' && env.MESH8_VARIANT != 'mesh8'
        run: |
          set -o pipefail
          echo "probe of the 32x32 mesh starts $(date -u)" | tee -a ci_logs/hdl-mesh8/RUN.txt
          timeout 30m make cocotb_mesh8_build STATS=ci_logs/hdl-mesh8/build_stats.txt MESH8_BUILD_JOBS=${MESH8_BUILD_JOBS-2} MESH8_CFLAGS="${MESH8_CFLAGS--CFLAGS -O1}" MESH8_HIER= 2>&1 | tee ci_logs/hdl-mesh8/probe.txt || echo "probe ended with status $? (124 = the 30 min bound)" | tee -a ci_logs/hdl-mesh8/RUN.txt
          { echo "probe done $(date -u)"; tail -1 ci_logs/hdl-mesh8/build_stats.txt; } | tee -a ci_logs/hdl-mesh8/RUN.txt
      - name: publish logs
        if: always()
        run: |
          for p in ci_sampler.pid ci_publisher.pid; do [ -f $p ] && kill $(cat $p) 2>/dev/null || true; done
          git config user.name "neo-ci" && git config user.email "ci@users.noreply.github.com"
          mkdir -p ci_logs/hdl-mesh8 && echo "finished $(date -u)" >> ci_logs/hdl-mesh8/RUN.txt
          flock -w 120 .ci_publish.lock -c '
            git checkout --orphan ci-logs-hdl-mesh8 2>/dev/null || git checkout ci-logs-hdl-mesh8
            git rm -rfq --cached . 2>/dev/null || true
            git add -f ci_logs
            git commit -m "hdl-mesh8 logs run ${{ github.run_number }}" || true
            git push origin ci-logs-hdl-mesh8 --force'
  # the open-PDK synthesis job (drop 0.40): 07_ci/synth/synth.py synthesizes every unit of the silicon tile (8x8 position,
  # 32x32 core, 2 MB bank, 1024-bit links, DV_HOOKS = 0) -- a module at its silicon parameters with its children black-boxed
  # -- with Yosys (the slang front end), the memory leaves (01_rtl/neo_mem.sv) priced by a macro model, and runs OpenSTA on
  # each unit with its subtree at 500 ps on ASAP7's SS corner; the gates (no latch, no multiply-driven net, a consistent
  # hierarchy, PE counts, no hook logic at DV_HOOKS = 0, every tool run clean) fail the job, the report (synth_report.md,
  # synth_results.json, the worst paths and stats per unit) goes to ci-logs-synth either way. Tools from GitHub only
  # (synth/tools.sh): the OSS CAD Suite nightly tarball, OpenSTA built from source once per cache key (the binary is
  # cached as soon as it is built), the ORFS platform libraries by sparse checkout. Should OpenSTA not build, tools.sh prints
  # its cmake / make logs and the job synthesizes without timing: the synthesis gates still run, the timing gate fails (fix38).
  # Drop 0.42: each library's run ends with the period sweep (OpenSTA again per unit at 500..1500 ps) and its verdict, and
  # the second library -- Nangate45 typical, the same units, its macro model from ORFS's FakeRAM45 macros -- runs after
  # ASAP7 into synth_out_nangate45, its report in ci_logs/synth/nangate45 (no timing models: they double the push), the two
  # side by side in ci_logs/synth/synth_report_libraries.md. Own concurrency group.
  synth:
    if: github.event_name != 'schedule' && !inputs.pnr_only
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: synth-${{ github.ref }}
      cancel-in-progress: true
    env:
      NEO_SYNTH_TOOLS: /home/runner/neo-synth      # the runner's own home: no sudo for the tools or the cache restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: flat layout
        run: |
          cp -r 01_rtl rtl && cp -r 07_ci/synth synth && cp 07_ci/Makefile Makefile
          mkdir -p ci_logs/synth && echo "run ${{ github.run_number }} $(date -u)" > ci_logs/synth/RUN.txt
          { echo "cores $(nproc)"; free -m | sed -n 2,3p; df -h / | tail -1; } | tee -a ci_logs/synth/RUN.txt
      - name: OpenSTA binary cache
        id: sta-cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/neo-synth/sta
          key: neo-synth-sta-f861c62-${{ runner.os }}-${{ runner.arch }}
      - name: tools (OSS CAD Suite, OpenSTA, the ORFS libraries)
        id: tools
        run: |
          set -o pipefail
          bash synth/tools.sh 2>&1 | tee ci_logs/synth/tools.txt
          echo "sta=$([ -x /home/runner/neo-synth/sta ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - name: cache the OpenSTA binary          # saved as soon as it is built, whatever the gates say afterwards
        if: steps.tools.outputs.sta == '1' && steps.sta-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/neo-synth/sta
          key: neo-synth-sta-f861c62-${{ runner.os }}-${{ runner.arch }}
      - name: synthesis and timing (ASAP7 SS, 500 ps; every unit of the tile; the period sweep)
        run: |
          set -o pipefail
          echo "synth starts $(date -u)" | tee -a ci_logs/synth/RUN.txt
          # two Yosys runs at a time on a 16 GB runner (the two largest units peak near 5 GB each), one on a 7 GB runner
          J=1; [ "$(free -m | awk '/Mem:/{print $2}')" -ge 14000 ] && J=2
          echo "SYNTH_JOBS=$J" | tee -a ci_logs/synth/RUN.txt
          make synth SYNTH_JOBS=$J 2>&1 | tee ci_logs/synth/synth.txt
      - name: synthesis and timing, the second library (Nangate45 TT; every unit; the period sweep)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          echo "synth nangate45 starts $(date -u)" | tee -a ci_logs/synth/RUN.txt
          J=1; [ "$(free -m | awk '/Mem:/{print $2}')" -ge 14000 ] && J=2
          make synth SYNTH_PDK=nangate45 SYNTH_CORNER=TT SYNTH_OUT=synth_out_nangate45 SYNTH_LOGS=ci_logs/synth/nangate45 \
            SYNTH_REPORT_ARGS=--lite SYNTH_JOBS=$J 2>&1 | tee ci_logs/synth/synth_nangate45.txt
          echo "synth nangate45 done $(date -u)" | tee -a ci_logs/synth/RUN.txt
      - name: the two libraries side by side
        if: ${{ !cancelled() }}
        run: make synth_compare 2>&1 | tee ci_logs/synth/compare.txt
      - name: publish logs
        if: always()
        run: |
          git config user.name "neo-ci" && git config user.email "ci@users.noreply.github.com"
          mkdir -p ci_logs/synth && { echo "finished $(date -u)"; free -m | sed -n 2p; } >> ci_logs/synth/RUN.txt
          git checkout --orphan ci-logs-synth
          git rm -rfq --cached . 2>/dev/null || true
          git add -f ci_logs
          git commit -m "synth logs run ${{ github.run_number }}" || true
          git push origin ci-logs-synth --force
  # the formal job (drop 0.41): SymbiYosys proofs of the protection logic -- 02_dv/formal/*.sby, one directory per task --
  # with the OSS CAD Suite tarball that synth/tools.sh pins, installed alone (NEO_TOOLS_ONLY=oss: no ORFS libraries, no
  # OpenSTA, no cache, about a minute). formal/run.py (07_ci/formal/run.py) runs every task, two at a time, 600 s each,
  # writes formal_report.md and fails the job unless every task is PASS; the report, every task's sby log and every
  # counterexample trace go to ci-logs-formal either way.
  formal:
    if: github.event_name != 'schedule' && !inputs.pnr_only
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEO_SYNTH_TOOLS: /home/runner/neo-synth      # the runner's own home: no sudo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: flat layout
        run: |
          cp -r 01_rtl rtl && cp -r 02_dv/formal formal && cp 07_ci/formal/run.py formal/run.py
          cp -r 07_ci/synth synth && cp 07_ci/Makefile Makefile
          mkdir -p ci_logs/formal && echo "run ${{ github.run_number }} $(date -u)" > ci_logs/formal/RUN.txt
          { echo "cores $(nproc)"; free -m | sed -n 2,3p; } | tee -a ci_logs/formal/RUN.txt
      - name: tools (the OSS CAD Suite alone)
        run: |
          set -o pipefail
          NEO_TOOLS_ONLY=oss bash synth/tools.sh 2>&1 | tee ci_logs/formal/tools.txt
          echo "/home/runner/neo-synth/oss-cad-suite/bin" >> "$GITHUB_PATH"
      - name: formal proofs (every 02_dv/formal/*.sby task)
        run: |
          set -o pipefail
          echo "formal starts $(date -u)" | tee -a ci_logs/formal/RUN.txt
          make formal FORMAL_JOBS=2 FORMAL_TIMEOUT=600 2>&1 | tee ci_logs/formal/formal.txt
      - name: publish logs
        if: always()
        run: |
          git config user.name "neo-ci" && git config user.email "ci@users.noreply.github.com"
          mkdir -p ci_logs/formal && echo "finished $(date -u)" >> ci_logs/formal/RUN.txt
          git checkout --orphan ci-logs-formal
          git rm -rfq --cached . 2>/dev/null || true
          git add -f ci_logs
          git commit -m "formal logs run ${{ github.run_number }}" || true
          git push origin ci-logs-formal --force
  tiles:
    if: github.event_name == 'workflow_dispatch' && !inputs.pnr_only
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - name: flat layout
        run: |
          cp -r 01_rtl rtl && cp -r 02_dv/tb tb && cp -r 02_dv/dv dv && cp -r 02_dv/sim sim
          for v in 02_dv/vectors*; do cp -r "$v" "$(basename "$v")"; done
          cp -r 03_models/model model && cp -r 03_models/compiler compiler && cp -r 04_software sw && cp -r 05_safety safety
          cp 07_ci/Makefile Makefile
          mkdir -p ci_logs/tiles && echo "run ${{ github.run_number }} $(date -u)" > ci_logs/tiles/RUN.txt
      - run: |
          make regress 2>&1 | tee ci_logs/tiles/regress_full.txt || true
          for t in M3 M9 M12 M13 M11 M8 M1 M2 M4 M5 M6 M7; do python3 sim/run_tile_test.py $t 2>&1 | tee ci_logs/tiles/$t.txt; done
          python3 sim/run_two_layer.py 2>&1 | tee ci_logs/tiles/M10.txt
      - name: publish logs
        if: always()
        run: |
          git config user.name "neo-ci" && git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs-tiles
          git rm -rfq --cached . 2>/dev/null || true
          git add -f ci_logs
          git commit -m "tiles logs run ${{ github.run_number }}" || true
          git push origin ci-logs-tiles --force
  # the place-and-route job (drop 0.42, stream A2b): 07_ci/pnr -- synth.py's netlist of a unit's subtree through
  # OpenROAD-flow-scripts on ASAP7 SS (floorplan with ORFS's macro placer, place, CTS, route, the final report with
  # OpenRCX), the memory leaves as FakeRAM2.0 macros; pnr/report.py writes pnr_<block>.md. The ORFS docker image of the
  # ORFS commit synth/tools.sh pins (pnr/tools.sh says why docker). Not on every push: a dispatch (inputs pnr_*;
  # pnr_only skips the other jobs), weekly (Sunday 02:00 UTC) and a push to main that touches 07_ci/pnr/**. pnr-plan
  # decides and starts the run's ci-logs-pnr; then one pnr job per block in parallel (a matrix: each block has a
  # runner's 6 h / 16 GB / 4 cores), each publishing ci_logs/pnr/<block>/ into ci-logs-pnr every 5 minutes and at the
  # end (pnr/publish.sh). run.py bounds the flow by the time the job has left, so a block that does not finish still
  # publishes how far it got.
  pnr-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.plan.outputs.run }}
      blocks: ${{ steps.plan.outputs.blocks }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: plan (a dispatch, the schedule, or a push to main that touches 07_ci/pnr/**)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BLOCKS: ${{ inputs.pnr_blocks }}
        run: |
          run=0
          case "$EVENT" in
            workflow_dispatch|schedule) run=1 ;;
            push)
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base="$BEFORE"; else base="$GITHUB_SHA~1"; fi
              changed=$(git diff --name-only "$base" "$GITHUB_SHA" -- 07_ci/pnr | head -n 5)
              echo "07_ci/pnr changed since ${base:0:9}: ${changed:-nothing}"
              [ -n "$changed" ] && run=1 ;;
          esac
          [ -n "$BLOCKS" ] || BLOCKS="mac_pe,c16_systolic_array,c16_neo_core"
          blocks=$(python3 -c 'import json, sys; print(json.dumps([b.strip() for b in sys.argv[1].split(",") if b.strip()]))' "$BLOCKS")
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "blocks=$blocks" >> "$GITHUB_OUTPUT"
          echo "$EVENT: run=$run blocks=$blocks"
      - name: start the run's ci-logs-pnr (the blocks add their directories)
        if: steps.plan.outputs.run == '1'
        env:
          EVENT: ${{ github.event_name }}
          BLOCKS_JSON: ${{ steps.plan.outputs.blocks }}
          PERIOD: ${{ inputs.pnr_period || '1000' }}
          FLOW_ARGS: ${{ inputs.pnr_flow_args }}
          IMAGE_INPUT: ${{ inputs.pnr_image }}
        run: |
          git config user.name "neo-ci" && git config user.email "ci@users.noreply.github.com"
          mkdir -p ci_logs/pnr
          { echo "run ${{ github.run_number }} ($EVENT on ${{ github.ref_name }} at ${{ github.sha }}) $(date -u)"
            echo "blocks $BLOCKS_JSON, period $PERIOD ps, flow args [$FLOW_ARGS], image [$IMAGE_INPUT]"; } > ci_logs/pnr/RUN.txt
          git checkout --orphan ci-logs-pnr
          git rm -rfq --cached . 2>/dev/null || true
          git add -f ci_logs/pnr/RUN.txt
          git commit -q -m "pnr run ${{ github.run_number }}: plan"
          git push origin ci-logs-pnr --force
  pnr:
    needs: pnr-plan
    if: needs.pnr-plan.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        block: ${{ fromJSON(needs.pnr-plan.outputs.blocks) }}
    env:
      NEO_SYNTH_TOOLS: /home/runner/neo-synth      # synth/tools.sh: the OSS CAD Suite, OpenSTA (cached), the ASAP7 libs
      NEO_PNR_TOOLS: /home/runner/neo-pnr          # pnr/tools.sh: FakeRAM2.0 (and image.txt)
      BLOCK: ${{ matrix.block }}
      PERIOD: ${{ inputs.pnr_period || '1000' }}
      FLOW_ARGS: ${{ inputs.pnr_flow_args }}
      IMAGE_INPUT: ${{ inputs.pnr_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: flat layout
        run: |
          date +%s > .job_start
          cp -r 01_rtl rtl && cp -r 07_ci/synth synth && cp -r 07_ci/pnr pnr
          mkdir -p ci_logs/pnr/$BLOCK
          echo "run ${{ github.run_number }}: $BLOCK at $PERIOD ps, flow args [$FLOW_ARGS] ($(date -u))" > ci_logs/pnr/$BLOCK/RUN.txt
          { echo "cores $(nproc)"; free -m | sed -n 2,3p; df -h / | tail -1; } | tee -a ci_logs/pnr/$BLOCK/RUN.txt
      - name: disk space for the ORFS image (the runner's unused toolchains)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1 | tee -a ci_logs/pnr/$BLOCK/RUN.txt
      # detailed routing keeps every finished worker of a batch (a quarter of the die: one colour of the 2 x 2
      # checkerboard, up to 1,024 workers) until the batch ends: run 164 peaked at 15.3 GB on c16_systolic_array and
      # c16_neo_core died at 15.6 GB in its first iteration. The finished workers are not touched again until the batch
      # ends, so swap holds them at little cost: 32 GB of swap file beside the runner's 16 GB.
      - name: swap for detailed routing's batch memory
        run: |
          sudo fallocate -l 32G /pnr.swap && sudo chmod 600 /pnr.swap && sudo mkswap -q /pnr.swap && sudo swapon /pnr.swap
          free -m | sed -n 2,3p | tee -a ci_logs/pnr/$BLOCK/RUN.txt
      - name: OpenSTA binary cache (the synth job's)
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/neo-synth/sta
          key: neo-synth-sta-f861c62-${{ runner.os }}-${{ runner.arch }}
      - name: tools (synth/tools.sh; pnr/tools.sh -- the ORFS image, FakeRAM2.0)
        run: |
          set -o pipefail
          bash synth/tools.sh 2>&1 | tee ci_logs/pnr/$BLOCK/tools.txt
          NEO_ORFS_IMAGE="$IMAGE_INPUT" bash pnr/tools.sh 2>&1 | tee -a ci_logs/pnr/$BLOCK/tools.txt
      - name: start the publisher (ci_logs/pnr/<block> into ci-logs-pnr every 5 minutes)
        run: |
          nohup bash pnr/publish.sh --loop 300 ci_logs/pnr/$BLOCK ci_logs/pnr/$BLOCK "pnr $BLOCK progress run ${{ github.run_number }}" > publisher.log 2>&1 &
          echo $! > publisher.pid
      - name: synthesis of the block's units at the period (synth.py)
        run: |
          set -o pipefail
          J=1; [ "$(free -m | awk '/Mem:/{print $2}')" -ge 14000 ] && J=2
          python3 synth/synth.py --rtl rtl --blocks $BLOCK --period $PERIOD --out synth_out --jobs $J 2>&1 | tee ci_logs/pnr/$BLOCK/synth.txt
      - name: place and route (pnr/run.py; the flow bounded by the job's time left)
        run: |
          set -o pipefail
          B=$(( 320 - ($(date +%s) - $(cat .job_start)) / 60 ))
          echo "budget $B min" | tee -a ci_logs/pnr/$BLOCK/RUN.txt
          python3 pnr/run.py --block $BLOCK --synth synth_out --out pnr_out --logs ci_logs/pnr/$BLOCK --runner docker \
            --image "$NEO_ORFS_IMAGE" --flow-args "$FLOW_ARGS" --budget-min $B 2>&1 | tee ci_logs/pnr/$BLOCK/run.txt
      - name: publish logs
        if: always()
        run: |
          [ -f publisher.pid ] && kill $(cat publisher.pid) 2>/dev/null || true
          { echo "finished $(date -u)"; free -m | sed -n 2p; df -h / | tail -1; } >> ci_logs/pnr/$BLOCK/RUN.txt
          cp publisher.log ci_logs/pnr/$BLOCK/ 2>/dev/null || true
          bash pnr/publish.sh ci_logs/pnr/$BLOCK ci_logs/pnr/$BLOCK "pnr $BLOCK logs run ${{ github.run_number }}"
